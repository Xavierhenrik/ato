name: lcf_app
description: LCF — EdTech jurídica mobile-first para estudantes de Direito e candidatos ao Exame da OAB.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.1

  # Auth + Backend
  supabase_flutter: ^2.3.2

  # Fonte Inter via Google Fonts (C5 — offline bundling no Sprint F8)
  google_fonts: ^6.2.1

  # Offline-first cache (Sprint F8)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Local storage
  path_provider: ^2.1.2

  # Deep links / URLs externas
  url_launcher: ^6.2.0

  # Auth — Sign in with Apple (Guideline 4.8)
  sign_in_with_apple: ^6.0.0
  crypto: ^3.0.3

  # IAP — RevenueCat (Guideline 3.1.1 — sem preço hardcoded)
  purchases_flutter: ^10.0.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.6.22
  shared_preferences: ^2.2.2

  # Models
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  # retrofit_generator removido — repositórios usam Dio puro (Sprint F1)
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
